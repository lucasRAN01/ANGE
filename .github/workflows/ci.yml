name: ANGE checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r core/requirements-dev.txt
      - run: python -m pytest core/tests -q
      - run: python tools/verify_jarvis.py
      - run: PYTHONPATH=third_party/jarvis python -m pytest third_party/jarvis/tests/test_memoire.py third_party/jarvis/tests/test_confidentialite.py third_party/jarvis/tests/test_hallucinations.py -q
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ANGE-Mobile-Mini-232-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
